<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEADER ACCESS Blink Extension</title>

  <script src="./tableau.extensions.1.latest.js"></script>

  <style>
    html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #00052b;
  color: #ffffff;
  font-family: Arial, sans-serif;
  overflow: auto;
}

#status {
  padding: 4px;
  font-size: 11px;
  color: #b7e4ff;
  background: #00052b;
}

#list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.item {
  box-sizing: border-box;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #00052b;
  border-bottom: 1px solid #36b9ff;
  font-size: 12px;
  line-height: 20px;
}

.yes {
  color: #00ff00;
}

.no {
  color: #ff001e;
  animation: blink 1s steps(2, start) infinite;
}

    @keyframes blink {
      to { visibility: hidden; }
    }
  </style>
</head>

<body>
  <div id="status">Connecting to Tableau...</div>
  <ul id="list"></ul>

  <script>
    window.addEventListener("load", async function () {
      const status = document.getElementById("status");
      const list = document.getElementById("list");

      function showError(message) {
        status.textContent = message;
        status.style.color = "#ff8080";
      }

      function cellText(cell) {
        if (!cell) return "";

        if (cell.formattedValue !== undefined) {
          return String(cell.formattedValue).trim();
        }

        if (cell.value !== undefined) {
          return String(cell.value).trim();
        }

        return "";
      }

      try {
        if (!window.tableau || !window.tableau.extensions) {
          throw new Error(
            "Tableau Extensions API โหลดไม่สำเร็จ"
          );
        }

        await window.tableau.extensions.initializeAsync();

        const dashboard =
          window.tableau.extensions.dashboardContent.dashboard;

        async function refresh() {
          try {
            const worksheets = dashboard.worksheets || [];

            const ws = worksheets.find(
              w => w.name.trim().toUpperCase() === "LEADER"
            );

            if (!ws) {
              showError('ไม่พบ Worksheet ชื่อ "LEADER"');
              return;
            }

            const data = await ws.getSummaryDataAsync({
              maxRows: 0
            });
            const data = await ws.getSummaryDataAsync({
              maxRows: 0
            });
            const columns = data.columns || [];
            
            console.log(
              "ชื่อคอลัมน์ทั้งหมด:",
              columns.map(c => ({
                fieldName: c.fieldName,
                caption: c.caption
              }))
            );
            
            console.log("จำนวนแถว:", (data.data || []).length);
            console.log("ตัวอย่างข้อมูลแถวแรก:", data.data?.[0]);
            

            const columns = data.columns || [];

            const accessIndex = columns.findIndex(c =>
              String(c.fieldName || "").trim().toUpperCase() === "ACCESS" ||
              String(c.caption || "").trim().toUpperCase() === "ACCESS"
            );

            if (accessIndex < 0) {
              showError("ไม่พบฟิลด์ ACCESS ใน Worksheet LEADER");
              return;
            }

            const rows = (data.data || [])
              .map(row =>
                cellText(row[accessIndex]).toUpperCase()
              )
              .filter(value => value === "YES" || value === "NO");

            while (list.firstChild) {
            list.removeChild(list.firstChild);
            }

            rows.forEach(value => {
              const li = document.createElement("li");
              li.className =
                "item " + (value === "NO" ? "no" : "yes");
              li.textContent = value;
              list.appendChild(li);
            });

            status.textContent = "ACCESS: " + rows.length + " rows";
            status.style.color = "#b7e4ff";

          } catch (error) {
            showError(
              "อ่านข้อมูลไม่สำเร็จ: " + error.message
            );
          }
        }

        await refresh();

        dashboard.worksheets.forEach(ws => {
          try {
            ws.addEventListener(
              window.tableau.TableauEventType.FilterChanged,
              refresh
            );
          } catch (_) {}
        });

      } catch (error) {
        showError(
          "Extension initialization failed: " + error.message
        );
      }
    });
  </script>
</body>
</html>
